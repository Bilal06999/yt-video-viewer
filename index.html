<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Video Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #121212;
      color: white;
    }

    .heading-text {
      text-align: center;
    }

    .input-group,
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 15px;
    }

    .input-group input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #222;
      color: white;
    }

    .input-group input[type="number"],
    .input-group button {
      border: 1px solid #444;
      padding: 8px;
      font-size: 16px;
      border-radius: 4px;
      background: #333;
      color: white;
    }

    .input-group button {
      background-color: red;
    }

    .input-group-row {
      display: flex;
      gap: 10px;
    }

    .stats {
      font-size: 16px;
      font-weight: 500;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 6px;
    }

    .videos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      padding: 10px;
      justify-content: center;
    }

    .video-wrapper {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      overflow: hidden;
      border-radius: 6px;
    }

    .video-wrapper iframe,
    .video-wrapper div {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: rgba(255, 0, 0, 0.8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
    }

    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
        align-items: stretch;
      }

      .input-group-row {
        display: flex;
        gap: 10px;
      }

      .input-group-row input,
      .input-group-row button {
        flex: 1;
      }

      .stats {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .mobile-mini-view .videos {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .mobile-mini-view .video-wrapper {
      aspect-ratio: 1 / 1;
    }
  </style>
</head>

<body>
  <h2 class="heading-text">YT Video Viewer</h2>

  <div class="input-group">
    <input type="text" id="videoLink" placeholder="Paste YouTube video link..." />
    <div class="input-group-row">
      <input type="number" id="tabCount" value="1" min="1" />
      <button onclick="openTabs()">Open</button>
    </div>
  </div>

  <div class="stats">
    <div id="totalVideos">Total videos: 0</div>
    <div id="totalMinutes">Total watched minutes: 0</div>
  </div>

  <button id="toggleViewBtn" style="display:none; margin-bottom: 10px;" onclick="toggleMobileView()">🔄 Toggle View</button>
  <div class="videos" id="videoContainer"></div>

  <!-- Load YouTube Iframe API -->
  <script>
    let tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>

  <script>
    let totalVideos = 0;
    let totalMinutes = 0;
    const API_KEY = 'AIzaSyBfdTzHS1y3GDGRuPPJi_bLKjS8Wye8oic';
    let players = [];

    function openTabs() {
      const linkInput = document.getElementById('videoLink');
      const link = linkInput.value.trim();
      const count = parseInt(document.getElementById('tabCount').value);
      const container = document.getElementById('videoContainer');

      if (!link || isNaN(count) || count < 1) return;

      const videoId = extractVideoID(link);
      if (!videoId) {
        alert("Invalid YouTube URL!");
        return;
      }

      getVideoDuration(videoId, (durationInSeconds) => {
        for (let i = 0; i < count; i++) {
          const videoWrapper = document.createElement('div');
          videoWrapper.className = 'video-wrapper';

          const closeBtn = document.createElement('span');
          closeBtn.className = 'close-btn';
          closeBtn.innerHTML = '✖';
          closeBtn.onclick = () => videoWrapper.remove();

          const iframeContainer = document.createElement('div');
          const playerId = `player_${Date.now()}_${i}`;
          iframeContainer.id = playerId;

          videoWrapper.appendChild(closeBtn);
          videoWrapper.appendChild(iframeContainer);
          container.appendChild(videoWrapper);

          let player = new YT.Player(playerId, {
            videoId: videoId,
            playerVars: {
              autoplay: 1,
              mute: 1,
              loop: 0,
              controls: 0,
              modestbranding: 1
            },
            events: {
              onReady: (event) => {
                event.target.playVideo();
                totalMinutes += durationInSeconds / 60;
                updateStats();
              },
              onStateChange: (event) => {
                if (event.data === YT.PlayerState.ENDED) {
                  totalMinutes += durationInSeconds / 60;
                  updateStats();
                  event.target.seekTo(0);
                  event.target.playVideo();
                }
              }
            }
          });

          players.push(player);
          totalVideos++;
        }

        updateStats();
        linkInput.value = '';
      });
    }

    function getVideoDuration(videoId, callback) {
      fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoId}&key=${API_KEY}`)
        .then(res => res.json())
        .then(data => {
          const duration = data.items[0].contentDetails.duration;
          const seconds = parseISODuration(duration);
          callback(seconds);
        })
        .catch(err => {
          console.error('Error fetching duration:', err);
          alert("Could not fetch duration");
        });
    }

    function parseISODuration(iso) {
      const match = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      let hours = parseInt(match[1]) || 0;
      let minutes = parseInt(match[2]) || 0;
      let seconds = parseInt(match[3]) || 0;
      return hours * 3600 + minutes * 60 + seconds;
    }

    function extractVideoID(url) {
      const shortLink = url.match(/youtube\.com\/shorts\/([^?&/]+)/);
      if (shortLink && shortLink[1].length === 11) return shortLink[1];
      const regExp = /^.*(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|watch\?.+&v=)([^#&?]{11}).*/;
      const match = url.match(regExp);
      return (match && match[1]) ? match[1] : null;
    }

    function updateStats() {
      document.getElementById('totalVideos').textContent = `Total videos: ${totalVideos}`;
      document.getElementById('totalMinutes').textContent = `Total watched minutes: ${Math.round(totalMinutes)}`;
    }

    let isMiniView = false;
    function toggleMobileView() {
      document.body.classList.toggle('mobile-mini-view', !isMiniView);
      isMiniView = !isMiniView;
    }

    function handleResize() {
      const toggleBtn = document.getElementById('toggleViewBtn');
      toggleBtn.style.display = window.innerWidth <= 600 ? 'block' : 'none';
      if (window.innerWidth > 600) {
        document.body.classList.remove('mobile-mini-view');
      }
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('load', handleResize);
  </script>
</body>

</html>
